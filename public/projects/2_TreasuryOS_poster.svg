<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#070B12"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#1C3050" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="1520" x2="1200" y2="1520"/>
    <line x1="80" y1="0" x2="80" y2="1600"/>
    <line x1="1120" y1="0" x2="1120" y2="1600"/>
  </g>
  <g stroke="#122236" stroke-width="1">
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="1360" x2="1120" y2="1360"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#4C8BF5" stroke-width="2">
    <path d="M80 80 L80 110 M80 80 L110 80" fill="none"/>
    <path d="M1120 80 L1120 110 M1120 80 L1090 80" fill="none"/>
    <path d="M80 1520 L80 1490 M80 1520 L110 1520" fill="none"/>
    <path d="M1120 1520 L1120 1490 M1120 1520 L1090 1520" fill="none"/>
  </g>

  <text x="80" y="140" font-family="Courier New, monospace" font-size="18" letter-spacing="5" fill="#4C8BF5">NON-CUSTODIAL · OWNER-CONTROLLED EXECUTION</text>

  <text x="78" y="330" font-family="Helvetica, Arial, sans-serif" font-size="118" font-weight="700" fill="#EAF0FB" letter-spacing="-1">TREASURY<tspan fill="#4C8BF5">OS</tspan></text>
  <text x="80" y="380" font-family="Courier New, monospace" font-size="24" fill="#7D93B8">AI treasury intelligence. Human-signed execution.</text>

  <!-- gauge dial: risk score -->
  <g transform="translate(300,600)">
    <circle r="150" fill="none" stroke="#1C3050" stroke-width="18"/>
    <path d="M -106 -106 A 150 150 0 1 1 106 -106" fill="none" stroke="#4C8BF5" stroke-width="18" stroke-linecap="round"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="#7D93B8" letter-spacing="2">RISK SCORE</text>
    <text x="0" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#EAF0FB">B+</text>
  </g>

  <!-- pipeline -->
  <g font-family="Courier New, monospace" font-size="22" fill="#EAF0FB">
    <text x="520" y="460">01  SCAN</text>
    <text x="520" y="520">02  ANALYZE</text>
    <text x="520" y="580">03  PLAN</text>
    <text x="520" y="640">04  EXECUTE</text>
    <text x="520" y="700">05  VERIFY</text>
  </g>
  <line x1="500" y1="440" x2="500" y2="690" stroke="#4C8BF5" stroke-width="2"/>
  <g fill="#4C8BF5">
    <circle cx="500" cy="450" r="5"/>
    <circle cx="500" cy="510" r="5"/>
    <circle cx="500" cy="570" r="5"/>
    <circle cx="500" cy="630" r="5"/>
    <circle cx="500" cy="690" r="5"/>
  </g>

  <line x1="80" y1="800" x2="1120" y2="800" stroke="#1C3050" stroke-width="1"/>

  <!-- readout panels -->
  <g font-family="Courier New, monospace" fill="#7D93B8">
    <text x="80" y="860" font-size="16" letter-spacing="2">NETWORK</text>
    <text x="80" y="895" font-size="28" fill="#EAF0FB">Ethereum Sepolia</text>

    <text x="450" y="860" font-size="16" letter-spacing="2">INTEGRATION</text>
    <text x="450" y="895" font-size="28" fill="#EAF0FB">Uniswap V3</text>

    <text x="820" y="860" font-size="16" letter-spacing="2">STAGE</text>
    <text x="820" y="895" font-size="28" fill="#EAF0FB">1 / Complete</text>
  </g>

  <line x1="80" y1="950" x2="1120" y2="950" stroke="#1C3050" stroke-width="1"/>

  <!-- signature: proof trail -->
  <text x="80" y="1010" font-family="Courier New, monospace" font-size="18" letter-spacing="3" fill="#4C8BF5">PROOF TRAIL</text>
  <g font-family="Courier New, monospace" font-size="18" fill="#5A6E90">
    <text x="80" y="1050">0x7a2f...c19e  report hash</text>
    <text x="80" y="1082">0x3b81...44df  tx receipt</text>
    <text x="80" y="1114">0x9e05...b2a7  verified ✓</text>
  </g>
  <rect x="80" y="1040" width="3" height="90" fill="#4C8BF5"/>
  <g transform="translate(60,0)">
    <text x="80" y="1050" font-family="Courier New, monospace" font-size="18" fill="#4C8BF5"></text>
  </g>

  <!-- feature row -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="80" y="1180" width="300" height="58" fill="none" stroke="#4C8BF5" stroke-width="2"/>
    <text x="105" y="1216" fill="#EAF0FB">Risk Engine</text>

    <rect x="400" y="1180" width="330" height="58" fill="#4C8BF5"/>
    <text x="425" y="1216" fill="#070B12">Execution Planner</text>

    <rect x="750" y="1180" width="370" height="58" fill="none" stroke="#4C8BF5" stroke-width="2"/>
    <text x="775" y="1216" fill="#EAF0FB">Receipt Verification</text>
  </g>

  <text x="80" y="1440" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#EAF0FB">TreasuryOS</text>
  <text x="80" y="1478" font-family="Courier New, monospace" font-size="18" fill="#5A6E90">treasuryos-web.vercel.app</text>
  <text x="1120" y="1478" text-anchor="end" font-family="Courier New, monospace" font-size="18" fill="#5A6E90">github.com/pk1427</text>
</svg>

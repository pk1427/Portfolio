<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B4C78" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridBig" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#245D8C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1600" fill="#0D2847"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>
  <rect width="1200" height="1600" fill="url(#gridBig)"/>

  <!-- title block, drafting style -->
  <rect x="60" y="60" width="1080" height="1480" fill="none" stroke="#5EC8E8" stroke-width="2"/>
  <rect x="76" y="76" width="1048" height="1448" fill="none" stroke="#5EC8E8" stroke-width="1"/>

  <text x="110" y="150" font-family="Courier New, monospace" font-size="18" letter-spacing="4" fill="#5EC8E8">FIG. 01 — MILESTONE FUNDING PROTOCOL</text>
  <line x1="110" y1="170" x2="1090" y2="170" stroke="#5EC8E8" stroke-width="1"/>

  <text x="108" y="290" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="100" fill="#EAF5FB" letter-spacing="-1">GRANTFLOW</text>
  <text x="110" y="335" font-family="Courier New, monospace" font-size="26" fill="#5EC8E8" letter-spacing="2">AI · CHAIN-AGNOSTIC ESCROW</text>

  <!-- schematic: escrow flow as pipe diagram -->
  <g transform="translate(110,420)">
    <!-- nodes -->
    <g font-family="Courier New, monospace" font-size="17" fill="#EAF5FB">
      <rect x="0" y="0" width="200" height="90" fill="none" stroke="#5EC8E8" stroke-width="2"/>
      <text x="18" y="40">FUNDER</text>
      <text x="18" y="65" fill="#8FB8D6">creates grant</text>

      <rect x="280" y="0" width="200" height="90" fill="none" stroke="#F2A65A" stroke-width="2"/>
      <text x="298" y="40" fill="#F2A65A">ESCROW</text>
      <text x="298" y="65" fill="#8FB8D6">funds locked</text>

      <rect x="560" y="0" width="200" height="90" fill="none" stroke="#5EC8E8" stroke-width="2"/>
      <text x="578" y="40">BUILDER</text>
      <text x="578" y="65" fill="#8FB8D6">submits evidence</text>

      <rect x="840" y="0" width="180" height="90" fill="none" stroke="#F2A65A" stroke-width="2"/>
      <text x="858" y="40" fill="#F2A65A">AGENTS</text>
      <text x="858" y="65" fill="#8FB8D6">verify work</text>
    </g>

    <!-- connecting pipe -->
    <path d="M200 45 H280 M480 45 H560 M760 45 H840" stroke="#5EC8E8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- release arm below -->
    <path d="M930 90 V150 H380 V90" stroke="#F2A65A" stroke-width="2" fill="none"/>
    <rect x="280" y="150" width="200" height="90" fill="#F2A65A"/>
    <text x="298" y="190" font-family="Courier New, monospace" font-size="17" fill="#0D2847">RELEASE</text>
    <text x="298" y="215" font-family="Courier New, monospace" font-size="15" fill="#0D2847">payment settled</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5EC8E8"/>
    </marker>
  </defs>

  <line x1="110" y1="740" x2="1090" y2="740" stroke="#245D8C" stroke-width="1"/>

  <!-- dimension-style spec sheet -->
  <g font-family="Courier New, monospace" fill="#8FB8D6">
    <text x="110" y="800" font-size="16" letter-spacing="2">REFERENCE CHAIN</text>
    <text x="110" y="835" font-size="28" fill="#EAF5FB">Casper Testnet</text>

    <text x="480" y="800" font-size="16" letter-spacing="2">CONTRACT LANG</text>
    <text x="480" y="835" font-size="28" fill="#EAF5FB">Odra (Rust)</text>

    <text x="840" y="800" font-size="16" letter-spacing="2">PLANNED CHAINS</text>
    <text x="840" y="835" font-size="26" fill="#EAF5FB">Base · Stellar</text>
  </g>

  <line x1="110" y1="890" x2="1090" y2="890" stroke="#245D8C" stroke-width="1"/>

  <!-- verified deploy stamp -->
  <g transform="translate(110,930)">
    <circle cx="60" cy="60" r="58" fill="none" stroke="#F2A65A" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="60" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#F2A65A">VERIFIED</text>
    <text x="60" y="72" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#F2A65A">DEPLOY</text>

    <text x="150" y="45" font-family="Courier New, monospace" font-size="16" fill="#8FB8D6">grant-004 · on-chain id 4</text>
    <text x="150" y="75" font-family="Courier New, monospace" font-size="16" fill="#8FB8D6">funded=true, released=true</text>
    <text x="150" y="105" font-family="Courier New, monospace" font-size="16" fill="#8FB8D6">100000000000 motes</text>
  </g>

  <!-- feature strip -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="110" y="1120" width="290" height="56" fill="none" stroke="#5EC8E8" stroke-width="2"/>
    <text x="132" y="1156" fill="#EAF5FB">Verification Agents</text>

    <rect x="420" y="1120" width="290" height="56" fill="#5EC8E8"/>
    <text x="442" y="1156" fill="#0D2847">Settlement Adapters</text>

    <rect x="730" y="1120" width="290" height="56" fill="none" stroke="#5EC8E8" stroke-width="2"/>
    <text x="752" y="1156" fill="#EAF5FB">Public API + SDK</text>
  </g>

  <line x1="110" y1="1240" x2="1090" y2="1240" stroke="#245D8C" stroke-width="1"/>
  <text x="110" y="1490" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#EAF5FB">GrantFlow AI</text>
  <text x="110" y="1528" font-family="Courier New, monospace" font-size="18" fill="#5A85A8">grant-flow-ai-web.vercel.app</text>
  <text x="1090" y="1528" text-anchor="end" font-family="Courier New, monospace" font-size="18" fill="#5A85A8">github.com/pk1427</text>
</svg>

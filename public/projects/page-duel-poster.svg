<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#30363D" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="1520" x2="1200" y2="1520"/>
    <line x1="80" y1="0" x2="80" y2="1600"/>
    <line x1="1120" y1="0" x2="1120" y2="1600"/>
  </g>
  <g stroke="#21262D" stroke-width="1">
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="1360" x2="1120" y2="1360"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#58A6FF" stroke-width="2">
    <path d="M80 80 L80 110 M80 80 L110 80" fill="none"/>
    <path d="M1120 80 L1120 110 M1120 80 L1090 80" fill="none"/>
    <path d="M80 1520 L80 1490 M80 1520 L110 1520" fill="none"/>
    <path d="M1120 1520 L1120 1490 M1120 1520 L1090 1520" fill="none"/>
  </g>

  <text x="80" y="140" font-family="Courier New, monospace" font-size="18" letter-spacing="5" fill="#58A6FF">FULL-STACK · EXPO · SUPABASE · STAGING</text>

  <text x="78" y="330" font-family="Helvetica, Arial, sans-serif" font-size="118" font-weight="700" fill="#E6EDF3" letter-spacing="-1">PAGE<tspan fill="#A371F7">DUEL</tspan></text>
  <text x="80" y="380" font-family="Courier New, monospace" font-size="24" fill="#8B949E">Two-player reading game. Deterministic engine. Secure publishing.</text>

  <!-- game engine architecture -->
  <text x="80" y="480" font-family="Courier New, monospace" font-size="20" letter-spacing="3" fill="#58A6FF">ARCHITECTURE</text>

  <g font-family="Courier New, monospace" font-size="22" fill="#E6EDF3">
    <text x="80" y="550">packages/game-core  →  deterministic TS engine</text>
    <text x="80" y="595">apps/player        →  Expo / React Native</text>
    <text x="80" y="640">apps/admin         →  Dashboard + Edge Functions</text>
    <text x="80" y="685">packages/book-data →  Versioned catalog + RLS</text>
    <text x="80" y="730">tools/book-prep    →  Python image pipeline</text>
  </g>
  <line x1="60" y1="530" x2="60" y2="720" stroke="#58A6FF" stroke-width="2"/>
  <g fill="#58A6FF">
    <circle cx="60" cy="540" r="5"/>
    <circle cx="60" cy="585" r="5"/>
    <circle cx="60" cy="630" r="5"/>
    <circle cx="60" cy="675" r="5"/>
    <circle cx="60" cy="720" r="5"/>
  </g>

  <line x1="80" y1="800" x2="1120" y2="800" stroke="#30363D" stroke-width="1"/>

  <!-- match flow -->
  <text x="80" y="880" font-family="Courier New, monospace" font-size="18" letter-spacing="3" fill="#A371F7">MATCH FLOW</text>
  <text x="80" y="930" font-family="Courier New, monospace" font-size="22" fill="#E6EDF3">JOIN  →  SEED  →  ROUNDS 1..N  →  TALLY  →  SUDDEN DEATH  →  RESULT</text>
  <line x1="80" y1="955" x2="1120" y2="955" stroke="#30363D" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- tech chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="80" y="1010" width="260" height="54" fill="none" stroke="#58A6FF" stroke-width="2"/>
    <text x="105" y="1044" fill="#E6EDF3">Reactive Engine</text>

    <rect x="360" y="1010" width="280" height="54" fill="url(#accent)"/>
    <text x="385" y="1044" fill="#0D1117">Supabase RLS + Auth</text>

    <rect x="660" y="1010" width="220" height="54" fill="none" stroke="#58A6FF" stroke-width="2"/>
    <text x="685" y="1044" fill="#E6EDF3">Expo Router</text>

    <rect x="900" y="1010" width="220" height="54" fill="none" stroke="#A371F7" stroke-width="2"/>
    <text x="925" y="1044" fill="#E6EDF3">pnpm Monorepo</text>
  </g>

  <line x1="80" y1="1120" x2="1120" y2="1120" stroke="#30363D" stroke-width="1"/>

  <!-- status badge -->
  <rect x="80" y="1170" width="200" height="44" rx="4" fill="#238636"/>
  <text x="180" y="1200" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="600" fill="#E6EDF3">STATUS: STAGING</text>

  <!-- stats -->
  <g font-family="Courier New, monospace" fill="#8B949E">
    <text x="80" y="1280" font-size="16" letter-spacing="2">PLAYERS</text>
    <text x="80" y="1315" font-size="26" fill="#E6EDF3">2 per match</text>

    <text x="470" y="1280" font-size="16" letter-spacing="2">ROUNDS</text>
    <text x="470" y="1315" font-size="26" fill="#E6EDF3">5 / 10 / 15</text>

    <text x="820" y="1280" font-size="16" letter-spacing="2">STACK</text>
    <text x="820" y="1315" font-size="26" fill="#E6EDF3">React Native · Supabase · TypeScript</text>
  </g>

  <line x1="80" y1="1380" x2="1120" y2="1380" stroke="#30363D" stroke-width="1"/>

  <!-- footer -->
  <text x="80" y="1500" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E6EDF3">Page Duel</text>
  <text x="80" y="1540" font-family="Courier New, monospace" font-size="18" fill="#8B949E">github.com/pk1427/page-duel</text>
  <text x="1120" y="1540" text-anchor="end" font-family="Courier New, monospace" font-size="18" fill="#8B949E">TODO: Replace with real screenshot</text>
</svg>